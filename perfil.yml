# Tu semblanza. Separa los párrafos con una línea en blanco.
# Usa *asteriscos* para poner títulos de obras en cursivas.
bio: |
  Doctor en Comunicación por la Universidad Anáhuac México, donde es profesor investigador de la Facultad de Comunicación y miembro del Human & NonHuman Communication Lab del CICA. Ahí lidera el AI Society Lab, una sociedad simulada de agentes de inteligencia artificial que se observa a lo largo del tiempo, con protocolo prerregistrado y datos abiertos.

  Su investigación trata a los modelos de lenguaje como actores comunicativos. Estudia cómo cambian su forma de hablar cuando se saben observados, cómo un solo agente negativo puede concentrar la atención de un grupo, y qué ocurre con la agencia humana cuando la evaluación académica se apoya en la IA, tema del que surgió el marco LOGOS.

  Su tesis doctoral analizó la experiencia de usuario en cursos masivos en línea (MOOC) en México, Brasil, Estados Unidos y Canadá. Es autor de *Criando Marcas na Era da Distração* (2020) y ponente TEDx.

distinciones:
  - Ponente TEDx
  - Claude Community Leader, Ciudad de México (Anthropic)

